name: "Conformance Gate"
description: >
  AI-powered conformance gate for Rust microservices.
  Uses OpenCode to autonomously explore the repository and detect
  architectural violations (BOX-001/002/003) plus deterministic
  Dockerfile checks (OCI-003/004/005).

inputs:
  service-path:
    description: "Relative path to the Rust service to evaluate (from repo root)"
    required: true

outputs:
  decision:
    description: "Conformance decision: pass | manual_review | block"
  confidence:
    description: "Confidence score (0.0 – 1.0)"
  violations:
    description: "JSON array of violations found"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install conformance agent dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install

    - name: Run conformance gate
      id: gate
      shell: bash
      # Run from repo root so OpenCode has access to all service files
      working-directory: ${{ github.workspace }}
      env:
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        INPUT_SERVICE_PATH: ${{ inputs.service-path }}
      run: |
        set +e
        OUTPUT=$(${{ github.action_path }}/node_modules/.bin/tsx \
          ${{ github.action_path }}/src/index.ts \
          --service "${{ inputs.service-path }}" 2>/dev/fd/2)
        EXIT_CODE=$?

        # Parse JSON output and expose as step outputs
        DECISION=$(echo "$OUTPUT" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{ try{ const r=JSON.parse(d); process.stdout.write(r.decision||'block') } catch(e){ process.stdout.write('block') } })")
        CONFIDENCE=$(echo "$OUTPUT" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{ try{ const r=JSON.parse(d); process.stdout.write(String(r.confidence||0)) } catch(e){ process.stdout.write('0') } })")
        VIOLATIONS=$(echo "$OUTPUT" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{ try{ const r=JSON.parse(d); process.stdout.write(JSON.stringify(r.violations||[])) } catch(e){ process.stdout.write('[]') } })")

        echo "decision=$DECISION"   >> "$GITHUB_OUTPUT"
        echo "confidence=$CONFIDENCE" >> "$GITHUB_OUTPUT"
        echo "violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"

        exit $EXIT_CODE
